name: 'Terraform DEV'

on:
  workflow_dispatch:
  push:
    branches:
      - 5_data_replication
      - 6_partitioning_sharding
    paths:
      - 'deploy/azure/**'
      - '.github/workflows/terraform_azure.dev.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'deploy/azure/**'
      - '.github/workflows/terraform_azure.dev.yml'

permissions:
  contents: read

env:
  TF_VAR_documentdb_admin_password: ${{ secrets.TF_VAR_DOCUMENTDB_ADMIN_PASSWORD }}

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        shell: bash
        working-directory: ./deploy/azure/envs/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
